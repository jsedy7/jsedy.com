name: Deploy Hugo site to GitHub Pages
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.151.0"
  HUGO_ENV: "production"
  PROD_BASE_URL: "https://jsedy.com/"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Update knowledgebase submodule to latest
        run: git submodule update --remote jsedy.com/knowledgebase

      - name: Sync /read/ section index files
        working-directory: jsedy.com
        run: bash scripts/sync-read-sections.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        working-directory: jsedy.com
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            BASE_URL="${PROD_BASE_URL}"
          else
            BASE_URL="${{ steps.pages.outputs.base_url }}/"
          fi

          echo "Using baseURL: $BASE_URL"
          hugo --minify --baseURL "$BASE_URL"
          # Disable Jekyll
          touch "$(pwd)/public/.nojekyll"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: jsedy.com/public

  deploy:
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
